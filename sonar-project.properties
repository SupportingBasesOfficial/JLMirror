# SonarQube configuration — JLMIRROR
# Exclui ferramentas dev internas e scripts de geracao de codigo da analise SAST

sonar.projectKey=SupportingBasesOfficial_JLMirror
sonar.organization=supportingbasesofficial

# Fontes analisadas (apenas codigo de producao)
sonar.sources=apps/api/src,apps/web/app,apps/web/components,apps/web/lib,packages

# Exclusoes — ferramentas dev, scripts, e2e, zero-error
sonar.exclusions=\
  **/e2e/**,\
  **/scripts/**,\
  **/.zero-error/**,\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/public/sw.js

# Cobertura de testes
sonar.coverage.exclusions=\
  **/e2e/**,\
  **/scripts/**,\
  **/.zero-error/**,\
  **/*.test.ts,\
  **/*.spec.ts
