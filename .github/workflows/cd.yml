name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9.0.0"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @jlmirror/api build

      - name: Build Web
        run: pnpm --filter @jlmirror/web build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: jlmirror-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: jlmirror-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            docker compose pull
            docker compose up -d --remove-orphans

      - name: Health Gate — wait for API
        run: |
          sleep 15
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.DEPLOY_HOST }}/api/v1/health/live || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "API healthy (attempt $i)"
              break
            fi
            echo "API not ready (attempt $i, status=$STATUS), retrying in 10s..."
            sleep 10
            if [ $i -eq 10 ]; then
              echo "API failed health gate after 10 attempts"
              exit 1
            fi
          done

      - name: Health Gate — wait for Web
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.DEPLOY_HOST }}/ || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Web healthy (attempt $i)"
              break
            fi
            echo "Web not ready (attempt $i, status=$STATUS), retrying in 10s..."
            sleep 10
            if [ $i -eq 10 ]; then
              echo "Web failed health gate after 10 attempts"
              exit 1
            fi
          done

      - name: Notify deploy success
        if: success()
        run: |
          echo "Deploy succeeded for commit ${{ github.event.workflow_run.head_sha }}"

  rollback:
    name: Rollback on failure
    runs-on: ubuntu-latest
    if: failure()
    needs: deploy
    steps:
      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git revert --no-commit HEAD
            docker compose up -d --remove-orphans
            echo "Rollback executado"
