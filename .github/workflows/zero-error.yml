# AI Black Box v2 — CI/CD Workflow
# Runs ALL validators on PRs (supreme judge). Timeout: 10 minutes.
# Bimodal enforcement: local hooks can be bypassed; CI cannot.

name: AI Black Box v2 Validation

on:
  pull_request:
    branches: [main, develop, master]
  push:
    branches: [main, master]

jobs:
  ai-blackbox-validate:
    name: AI Black Box v2 — 100% Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Injeta a infraestrutura distributed para suporte de testes integrados e RLS
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_secure_password
          POSTGRES_DB: jlmirror_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Go (Required for gitleaks)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install AI Black Box dependencies
        run: |
          if [ -d .zero-error ]; then
            cd .zero-error
            npm install --omit=dev
          else
            echo "AI Black Box v2: .zero-error/ not found."
            exit 1
          fi

      - name: Install security tools
        run: |
          pip install semgrep
          go install github.com/gitleaks/gitleaks/v8@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Verify integrity (immutable files)
        run: |
          node --input-type=module -e "
            import('./.zero-error/lib/integrity-guard.js').then(m => {
              const r = m.verifyIntegrity('.zero-error');
              if (!r.valid) {
                console.error('INTEGRITY VIOLATION:');
                r.violations.forEach(v => console.error('  - ' + v.file + ': ' +v.reason));
                process.exit(1);
              }
              console.log('Integrity: OK');
            }).catch(err => {
              console.error('Integrity check failed:', err.message);
              process.exit(1);
            });
          "

      - name: Run AI Black Box validators (CI mode — supreme judge)
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres_secure_password@localhost:5432/jlmirror_test
          REDIS_URL: redis://localhost:6379/0
          STRESS_CONNECTOR_TOKEN: mock-zabbix-connector-token-secure-uuid
          PORT: 3001
        run: node .zero-error/validators/index.js ci

      - name: Upload AI Black Box report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-blackbox-report
          path: |
            zero-error-feedback.json
            coverage/
            .zero-error/.validator-cache.json
          retention-days: 7
