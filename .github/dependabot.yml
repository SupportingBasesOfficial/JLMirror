# Dependabot — JLMIRROR
# Mantém dependências atualizadas automaticamente.
# PRs são criados mas NÃO auto-mergidos — precisam passar CI + zero-error + review.

version: 2

updates:
  # npm — apps/api
  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(api)"
    labels:
      - dependencies
      - api

  # npm — apps/web
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(web)"
    labels:
      - dependencies
      - web

  # npm — raiz (devDependencies compartilhadas)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(root)"
    labels:
      - dependencies

  # npm — packages/*
  - package-ecosystem: npm
    directory: /packages/auth
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(auth)"
    labels:
      - dependencies
      - packages

  - package-ecosystem: npm
    directory: /packages/cache
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(cache)"
    labels:
      - dependencies
      - packages

  - package-ecosystem: npm
    directory: /packages/db
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(db)"
    labels:
      - dependencies
      - packages

  - package-ecosystem: npm
    directory: /packages/zabbix
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(zabbix)"
    labels:
      - dependencies
      - packages

  # Docker — docker-compose.yml
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker)"
    labels:
      - dependencies
      - docker

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(ci)"
    labels:
      - dependencies
      - ci
